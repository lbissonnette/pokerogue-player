[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerogue-player"
version = "0.1.0"
description = "Play PokeRogue on pokerogue.net with an LLM via OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pokerogue-player = "pokerogue_player.cli:main"

[tool.setuptools]
packages = ["pokerogue_player"]

[tool.setuptools.package-data]
pokerogue_player = ["bridge.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
